name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Syntax check install.sh
        run: bash -n install.sh

      - name: Verify stow packages exist
        run: |
          for pkg in claude equibop flow ghostty gitu nvim opencode pi; do
            test -d "$pkg" || { echo "missing package: $pkg"; exit 1; }
          done